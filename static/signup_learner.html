<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #050505 20%, #272626 70%, #414141 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            color: #e6f2f5;
            margin-bottom: 35px;
            font-size: 2.5rem;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #e6f2f5;
            font-weight: 500;
            font-size: 1.3rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            font-size: 1.2rem;
            transition: border-color 0.3s;
            background-color: rgba(255, 255, 255, 0.08);
            color: #e6f2f5;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #61929e;
            background-color: rgba(255, 255, 255, 0.12);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: #e6f2f5;
        }

        .remember-me input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .remember-me label {
            margin-bottom: 0;
            cursor: pointer;
        }

        .forgot-password {
            color: #61929e;
            text-decoration: none;
            font-size: 1.2rem;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #f0f3f6;
            color: #063234;
            border: 1px solid #f0f3f6;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            background-color: #61929e;
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            color: #abb1b2;
            font-size: 1.2rem;
        }

        .signup-link a {
            color: #61929e;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Signup</h2>
        <div id="error-message" style="color: #ff6b6b; margin-bottom: 15px; display: none;"></div>
        <div id="success-message" style="color: #4ade80; margin-bottom: 15px; display: none;"></div>
        <form id="signup-form">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <button type="submit" id="signup-btn">Signup</button>
        </form>
        <div class="signup-link">
            Already have an account? <a href="/login/learner">Login</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <!-- Similar structure, but with name field -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
  apiKey: "AIzaSyC2rlfeMUUbfaYOOLtAE8GbLmsvNlk0hcQ",
  authDomain: "open-palm.firebaseapp.com",
  projectId: "open-palm",
  storageBucket: "open-palm.firebasestorage.app",
  messagingSenderId: "174112346608",
  appId: "1:174112346608:web:c5d6ccbc9cfb0089034d35",
  measurementId: "G-ZJ7Y7RYSCB"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('signup-form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Create user with Firebase
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const idToken = await user.getIdToken();
                
                // Send to backend to create Firestore doc
                const response = await fetch('/api/signup/learner', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        idToken: idToken,
                        name: name 
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/user_dashboard';
                } else {
                    alert('Signup failed: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
