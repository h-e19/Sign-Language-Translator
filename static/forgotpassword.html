<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #050505 20%, #272626 70%, #414141 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: #e6f2f5;
            margin-bottom: 15px;
            font-size: 2.0rem;
        }

        .description {
            text-align: center;
            color: #d1d1d1;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e6f2f5;
            font-weight: 500;
            font-size: 1.2rem;
        }

        input[type="email"] {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            font-size: 1.1rem;
            transition: border-color 0.3s;
            background-color: rgba(255, 255, 255, 0.08);
            color: #e6f2f5;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #61929e;
            background-color: rgba(255, 255, 255, 0.12);
        }

        button {
            width: 100%;
            padding: 15px;
            background: #f0f3f6;
            color: #063234;
            border: 1px solid #f0f3f6;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            background-color: #61929e;
        }

        button:disabled {
            background: #ccc;
            border-color: #ccc;
            cursor: not-allowed;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            color: #abb1b2;
            font-size: 1.1rem;
        }

        .back-link a {
            color: #61929e;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            display: none;
            font-size: 1rem;
        }

        .error-message {
            background-color: rgba(255, 80, 80, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 80, 80, 0.2);
        }

        .success-message {
            background-color: rgba(80, 255, 120, 0.15);
            color: #4ade80;
            border: 1px solid rgba(80, 255, 120, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Forgot Password</h2>
        <p class="description">Enter your email address and we'll send you a link to reset your password.</p>

        <div id="error-message" class="message error-message"></div>
        <div id="success-message" class="message success-message"></div>

        <form id="forgot-password-form">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" id="reset-btn">Send Reset Link</button>
        </form>

        <div class="back-link">
            Remember your password? <a href="#" id="backToLogin">Back to Login</a>
        </div>
        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const userType = urlParams.get('type') || 'learner'; // default to learner
    
        document.getElementById('backToLogin').href = `/login/${userType}`;
        </script>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBZ_vrLtYP2H3-gmRA6m6zMzj4mk9wzWW8",
            authDomain: "sign-language-translator-78dd6.firebaseapp.com",
            projectId: "sign-language-translator-78dd6",
            storageBucket: "sign-language-translator-78dd6.firebasestorage.app",
            messagingSenderId: "231405675632",
            appId: "1:231405675632:web:86faf82a210fa610f100b5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        document.getElementById('forgot-password-form')
        .addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const resetBtn = document.getElementById('reset-btn');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            resetBtn.disabled = true;
            resetBtn.textContent = 'Sending...';

            try {
                await auth.sendPasswordResetEmail(email);

                successDiv.textContent = 'Password reset link sent! Check your email inbox.';
                successDiv.style.display = 'block';

                document.getElementById('email').value = '';

                resetBtn.disabled = false;
                resetBtn.textContent = 'Send Reset Link';

                setTimeout(() => {
                    window.location.href = '/login';
                }, 3000);

            } catch (error) {
                let errorMessage = 'Failed to send reset email. ';

                if (error.code === 'auth/user-not-found') {
                    errorMessage += 'No account found with this email.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage += 'Invalid email address.';
                } else {
                    errorMessage += error.message;
                }

                errorDiv.textContent = errorMessage;
                errorDiv.style.display = 'block';

                resetBtn.disabled = false;
                resetBtn.textContent = 'Send Reset Link';
            }
        });
    </script>

</body>
</html>
